# Automatisch von AIdeation angelegt: Build und Tests als Quality Gate für Pull Requests und main.
name: CI
on:
  push:
    branches: [main, 'sprint/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
